<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>VEX VR persistence knowledge graph</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#222;background:#fafafa}
header{padding:12px 18px 8px;border-bottom:1px solid #ddd;background:#fff}
h1{font-size:17px;margin:0 0 4px}
.sub{font-size:12px;color:#555;max-width:1200px;line-height:1.45}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 18px;background:#fff;border-bottom:1px solid #e5e5e5;font-size:12px}
.tab{border:1px solid #bbb;background:#f4f4f4;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px}
.tab.on{background:#1F3864;color:#fff;border-color:#1F3864}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid #ccc;border-radius:12px;cursor:pointer;user-select:none;background:#fff}
.chip.off{opacity:.35}
.sw{width:18px;height:0;border-top:2.5px solid}
.sep{width:1px;height:20px;background:#ddd;margin:0 6px}
#wrap{display:flex;height:calc(100vh - 150px);min-height:520px}
#canvas{flex:1;position:relative;overflow:hidden;background:#fff}
svg{width:100%;height:100%;cursor:grab}
svg.drag{cursor:grabbing}
#side{width:390px;border-left:1px solid #ddd;background:#fff;overflow:auto;padding:12px 14px;font-size:12.5px;line-height:1.45}
#side h2{font-size:14px;margin:0 0 2px}
#side .cls{color:#666;font-size:11.5px;margin-bottom:8px}
#side dt{font-weight:600;color:#1F3864;margin-top:7px;font-size:11.5px;text-transform:none}
#side dd{margin:1px 0 0 0;white-space:pre-wrap}
#side .rel{margin:2px 0;font-size:12px}
#side .rel a{color:#2E5496;cursor:pointer;text-decoration:underline}
#side .inf{color:#8a5aa8}
.tag{display:inline-block;background:#EDE3F3;color:#5b3b73;border-radius:3px;padding:0 5px;margin:1px 2px 1px 0;font-size:11px}
.node rect{rx:4;ry:4}
.node text{font-size:10.5px;pointer-events:none}
.node{cursor:pointer}
.dim{opacity:.12}
.coltitle{font-size:11px;font-weight:700;fill:#666;letter-spacing:.04em}
.legend{font-size:11px;color:#444}
.hint{font-size:11px;color:#777}
#defs{margin-top:10px}
@media (max-width:900px){#wrap{flex-direction:column;height:auto}#canvas{height:78vh;flex:none}#side{width:auto;border-left:0;border-top:1px solid #ddd}}
</style></head><body>

mmary": "Classes A-C (outcome record)"}, "data": [], "inf": ["OutcomeDependentVariable"]}, "attr_unresolved_ending": {"label": "unresolved_ending (session attribute)", "cls": "SessionAttribute", "layer": "L2 Signals", "ann": {"identifier": "unresolved_ending", "rdfs:comment": "The session ended without a final attempt.", "derivationRule": "TRUE when the session's last sig_run_attempt is followed by >= 1 code micro-action and no further RUN (Part IV, PER-PF1a input row).", "grain": "session", "outputType": "binary", "modellingNote": "Modelled as its own node because the layer rules let only portfolio indicators read session attributes; it is what PER-PF1a's return is conditioned on."}, "data": [], "inf": []}, "PER-1a": {"label": "PER-1a Consecutive-Unsuccessful Streak", "cls": "SessionIndicator", "layer": "L3 Indicators", "ann": {"identifier": "PER-1a", "rdfs:comment": "How hard the stretch was: the longest run of consecutive unsuccessful attempts in the session.", "outputType": "integer", "baseRate": "Length >= 1 in 60.6% and >= 2 in 48.6% of telemetered CastleCrasherPlus sessions.", "warrant": "PER-1b establishes THAT a challenge was encountered; PER-1a measures HOW HARD the stretch was. Both discharge PER-C1, which is why they are lettered as a pair.", "derivationRule": "MAX run length of consecutive sig_unsuccessful_attempt over attempts with an outcome record, in attempt order (attempts without a tick are skipped). Ties: first longest run kept. Anchors PER-3a, PER-3b, ADA-3b.", "notApplicableWhen": "NA without an outcome record", "grain": "session", "formerly": "P9.2a (Round 9c); P6.2a", "implementation": "ind_PER_1a", "specRef": "Rules Part IV; ontology PER-1a", "knownDependency": "Structurally linked to PER-3a, which is read off the streak PER-1a locates and is defined only where PER-1a >= 1: not independent evidence. The +0.507 correlation reported before Round 10d came largely from coding no-streak sessions as PER-3a = 0; where PER-3a is defined it is close function bar(){
  const b=document.getElementById('bar'); b.innerHTML='';
  for(const k in D.views){const t=document.createElement('span');t.className='tab'+(k===view?' on':'');t.textContent=D.views[k].title;
    t.onclick=()=>{view=k;selected=null;lineageMode=false;render();};b.appendChild(t);}
  b.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
  const used=new Set(D.views[view].edges.map(e=>D.props[e[1]].group));
  for(const g of Object.keys(D.groups)){ if(!used.has(g)) continue;
    const c=document.createElement('span');c.className='chip'+(groupsOn[g]?'':' off');
    c.innerHTML='<span class="sw" style="border-color:'+D.gcolor[g]+'"></span>'+g+' '+esc(D.groups[g]);
    c.onclick=()=>{groupsOn[g]=!groupsOn[g];render();};b.appendChild(c);}
  b.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
  const inf=document.createElement('span');inf.className='chip'+(showInferred?'':' off');
  inf.innerHTML='<span class="sw" style="border-color:#555;border-top-style:dashed"></span>reasoner-inferred links';
  inf.onclick=()=>{showInferred=!showInferred;render();};b.appendChild(inf);
  const h=document.createElement('span');h.className='hint';h.textContent='  Click a node for its rules. Drag to pan, scroll to zoom. Double-click a value to trace it back to the log fields.';
  b.appendChild(h);
}

let pos={};
function layout(v){
  pos={}; const colW=[],gap=70; let x=20;
  const H=24, P=7;
  v.cols.forEach((c,ci)=>{
    const w=Math.max(150,Math.min(300,6.1*Math.max(...c[1].map(i=>D.nodes[i].label.length))+18));
    colW.push(w);
    const total=c[1].length*(H+P);
    let y=60+Math.max(0,(700-total)/2);
    c[1].forEach(i=>{pos[i]={x:x,y:y,w:w,h:H};y+=H+P;});
    c.x=x;c.w=w;x+=w+gap+ (ci===2&&view==='applic'?40:0);
  });
  return x;
}

function render(){

      d=`M${x0},${y0} C${x0+bend},${y0} ${x0+bend},${y1} ${x0},${y1}`;}
    else{const fwd=b.x>a.x;const x0=fwd?a.x+a.w:a.x,x1=fwd?b.x:b.x+b.w,y0=a.y+a.h/2,y1=b.y+b.h/2,m=(x0+x1)/2;
      d=`M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1}`;}
    const hit=selected&&!lin&&(s===selected||o===selected); if(hit){nbr.add(s);nbr.add(o);}
    const cls=(selected&&!lin&&!hit)||(lin&&!(lin.has(s)&&lin.has(o)))?'dim':'';

    const t=el('title',{},path);t.textContent=D.nodes[s].label+'  —'+D.props[p].label+'→  '+D.nodes[o].label+(inf?'  (inferred)':'');
  });

    const dim=(selected&&!lin&&!nbr.has(i))||(lin&&!lin.has(i));

    el('rect',{width:p.w,height:p.h,fill:f,stroke:i===selected?'#E45756':s,'stroke-width':i===selected?2.4:(unob?1.4:1.1),'stroke-dasharray':unob?'2 3':''},g);
    const dark=n.layer==='Student model'&&!unob;
    const t=el('text',{x:7,y:16,fill:dark?'#fff':'#222'},g);
    t.textContent=n.label.length>52?n.label.slice(0,50)+'…':n.label;
    if(unob){t.setAttribute('fill','#6B6B6B');t.setAttribute('font-style','italic');}
    if(n.inf&&n.inf.length){el('circle',{cx:p.w-6,cy:6,r:3,fill:'#8A5AA8'},g);}
    g.onclick=(ev)=>{ev.stopPropagation();selected=i;lineageMode=false;render();};
    g.ondblclick=(ev)=>{ev.stopPropagation();selected=i;lineageMode=true;render();};
  });
  const defs=el('defs',{},vp);
  for(const g in D.gcolor){const m=el('marker',{id:'arr'+g,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',fill:D.gcolor[g]},m);}
  side();
  if(!render.fitted||render.fitted!==view){fit(width);render.fitted=view;}
}

let T={x:0,y:0,k:1};
function apply(){vp.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`);}
function fit(width){const r=svg.getBoundingClientRect();const k=Math.min(1.1,(r.width-20)/width, (r.height-10)/Math.max(780,maxY()+20));T={x:10,y:0,k:k};apply();}
function maxY(){let m=0;for(const i in pos)m=Math.max(m,pos[i].y+pos[i].h);return m;}
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!drag)return;T.x=drag.tx+e.clientX-drag.x;T.y=drag.ty+e.clientY-drag.y;apply();});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag');});
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const k2=Math.max(0.2,Math.min(3,T.k*(e.deltaY<0?1.12:1/1.12)));T.x=mx-(mx-T.x)*k2/T.k;T.y=my-(my-T.y)*k2/T.k;T.k=k2;apply();},{passive:false});
svg.addEventListener('click',()=>{if(selected){selected=null;lineageMode=false;render();}});

function link(i){return '<a data-id="'+i+'">'+esc(D.nodes[i]?D.nodes[i].label:i)+'</a>';}
function side(){
  const s=document.getElementById('side');
  if(!selected){
    let h='<h2>How to read this</h2><div class="cls">Each box is a node; its colour marks the layer. Links are coloured by group; dashed links were added by the reasoner.</div>';
    h+='<dl>';
    for(const g in D.groups){h+='<dt><span class="sw" style="display:inline-block;vertical-align:middle;border-color:'+D.gcolor[g]+'"></span> '+g+' '+esc(D.groups[g])+'</dt><dd>'+esc(GROUP_TXT[g])+'</dd>';}
    h+='</dl><div id="defs"><h2>What the reasoner classifies</h2><div class="cls">Roles the reasoner works out from the links, and the nodes it finds in each. A purple dot on a node means it has one.</div>';
    for(const c in D.defined){const d=D.defined[c];if(c.startsWith('ValueMeets_'))continue;
      h+='<dt>'+esc(d.label)+'</dt><dd>'+esc(d.comment)+'<br>'+(d.members.length?d.members.map(link).join(', '):'<i>none</i>')+'</dd>';}
    h+='</div>'; s.innerHTML=h; wire(s); return;}
  const n=D.nodes[selected];
  let h='<h2>'+esc(n.label)+'</h2><div class="cls">'+esc(D.classes[n.cls]?D.classes[n.cls].label:n.cls)+' · '+esc(n.layer)+'</div>';
  if(n.inf.length){h+='<div>'+n.inf.map(t=>'<span class="tag">'+esc(D.defined[t].label)+'</span>').join('')+'</div>';}
  h+='<dl>';
  const bv=(D.views[view].binding||{})[selected];
  if(bv){h+='<dt>rule in this class</dt><dd>'+esc(bv)+'</dd>';}
  if((D.views[view].unobs||[]).includes(selected)){h+='<dt>in this class</dt><dd>Not observed here under the playground-specific bindings.</dd>';}
  for(const k of ANN_ORDER){if(n.ann[k]) h+='<dt>'+esc(ANN_LABEL[k]||k)+'</dt><dd>'+esc(n.ann[k])+'</dd>';}
  if(n.data.length){h+='<dt>data values</dt><dd>'+n.data.map(d=>esc(d[0])+' = '+esc(d[1])).join('<br>')+'</dd>';}
  h+='</dl>';
  if(lineageMode){h+='<dt>traced back to (all inputs, down to the log fields)</dt><dd>'+((D.lineage[selected]||[]).map(link).join(', ')||'<i>none</i>')+'</dd>';}
  const out=[],inn=[];
  for(const k in D.views){D.views[k].edges.forEach(e=>{if(e[0]===selected)out.push(e);if(e[2]===selected)inn.push(e);});}
  const uniq=a=>{const m={};a.forEach(e=>m[e.join('|')]=e);return Object.values(m);};
  h+='<dt>links from this node</dt>'+uniq(out).map(e=>'<div class="rel'+(e[3]?' inf':'')+'">'+esc(D.props[e[1]].label)+' → '+link(e[2])+(e[3]?' (inferred)':'')+'</div>').join('');
  h+='<dt>links to this node</dt>'+uniq(inn).map(e=>'<div class="rel'+(e[3]?' inf':'')+'">'+link(e[0])+' → '+esc(D.props[e[1]].label)+(e[3]?' (inferred)':'')+'</div>').join('');
  s.innerHTML=h; wire(s);
}
function wire(s){s.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{const i=a.dataset.id;
  if(!pos[i]){for(const k in D.views){if(D.views[k].cols.some(c=>c[1].includes(i))){view=k;break;}}}
  selected=i;lineageMode=false;render();});}
const GROUP_TXT={INP:'What a value is computed from. The reasoner follows these links back to the log fields. Columns computed alongside an indicator are not counted as its inputs.',
 COND:'When, or out of what, a value is read: the setback it is read after, what a share is out of, and where it has a value at all.',
 DEP:'Overlaps between indicators disclosed in the specification. Two indicators joined here must not be counted as two separate pieces of evidence.',
 EVID:'How a value counts as evidence. A status is decided only through evidence clauses (nodes with a threshold); the dashed “sets status of” links are added by the reasoner from them.',
 APPL:'Where a rule can be computed: each signal’s rule in each playground class, which classes each indicator works in, and the playgrounds in each class.',
 INST:'Data from one documented session.'};
render();
window.addEventListener('resize',()=>{render.fitted=null;render();});
</script></body></html>
